<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VB Transit Arcade" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230f1220'/%3E%3Crect x='22' y='22' width='56' height='56' fill='%233dff7a'/%3E%3Ctext x='50' y='66' font-size='44' font-family='monospace' font-weight='bold' fill='%230f1220' text-anchor='middle'%3EV%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <title>VB Transit Arcade</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>VB Transit Arcade</h1>
      <span id="updated" class="updated"></span>
    </div>
    <div class="actions">
      <button id="settings-btn" class="icon-btn" aria-label="Settings" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button id="refresh" class="icon-btn" aria-label="Refresh" title="Refresh now">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      </button>
    </div>
  </header>

  <main id="app">
    <div class="route-pick">
      <button id="from-btn" class="place-btn" aria-label="Choose start"></button>
      <button id="swap-btn" class="swap-btn" aria-label="Swap start and destination">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="17 3 21 7 17 11"/><path d="M21 7H3"/><polyline points="7 21 3 17 7 13"/><path d="M3 17h18"/></svg>
      </button>
      <button id="to-btn" class="place-btn" aria-label="Choose destination"></button>
    </div>

    <div id="saved-commutes" class="saved-commutes" role="list" aria-label="Saved commutes"></div>

    <div class="depart">
      <span class="depart-label">Depart</span>
      <div class="seg" role="group" aria-label="Departure time">
        <button class="pill" id="depart-now" aria-pressed="true">Now</button>
        <button class="pill" id="depart-at" aria-pressed="false">At…</button>
      </div>
      <input type="datetime-local" id="depart-input" class="depart-input" hidden aria-label="Departure date and time" />
    </div>

    <div class="mode-row">
      <span class="depart-label">Mode</span>
      <div class="seg" role="group" aria-label="Travel mode">
        <button class="pill active" id="mode-auto" aria-pressed="true">Auto</button>
        <button class="pill" id="mode-bike" aria-pressed="false">Bike</button>
        <button class="pill" id="mode-transit" aria-pressed="false">Transit</button>
      </div>
    </div>

    <div id="prefs" class="prefs hidden"></div>

    <section id="weather" class="weather hidden" aria-live="polite"></section>

    <section id="options" class="options" aria-live="polite"></section>

    <p id="error" class="error hidden"></p>
  </main>

  <footer class="foot">
    <span>Live MVV EFA departures | Open-Meteo</span>
    <span id="stale" class="stale hidden">stale - offline</span>
  </footer>
  <p class="made">Made by <a href="https://github.com/VishalBalaji321/personal-route-planner" target="_blank" rel="noopener noreferrer">Vishal Balaji</a></p>

  <div id="settings-overlay" class="overlay hidden"></div>
  <section id="picker-sheet" class="sheet hidden" role="dialog" aria-label="Choose a place">
    <div class="sheet-head">
      <h2 id="picker-title">Choose a place</h2>
      <button id="picker-close" class="icon-btn" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="sheet-body">
      <button id="picker-gps" class="gps-btn" aria-label="Use current location">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/></svg>
        <span>Use current location</span>
      </button>
      <p id="gps-status" class="gps-status hidden"></p>
      <input id="picker-search" class="search-input" type="search" autocomplete="off" placeholder="Search address or station..." aria-label="Search address or station" />
      <div id="picker-results" class="picker-results hidden"></div>
      <div id="picker-saved" class="picker-saved"></div>
    </div>
  </section>

  <section id="settings-sheet" class="sheet hidden" role="dialog" aria-label="Settings">
    <div class="sheet-head">
      <h2>Settings</h2>
      <button id="settings-close" class="icon-btn" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="sheet-body">
      <div class="field">
        <label for="max-bike">Max bike time</label>
        <div class="field-row">
          <input id="max-bike" type="number" min="1" max="240" step="1" inputmode="numeric" />
          <span class="unit">minutes</span>
        </div>
        <p class="hint">Bike options longer than this are hidden (bike to station, or all the way).</p>
      </div>
    </div>
    <div class="sheet-actions">
      <button id="settings-reset" class="btn ghost">Reset</button>
      <button id="settings-save" class="btn primary">Save</button>
    </div>
  </section>

  <script src="/app.js" defer></script>
</body>
</html>
